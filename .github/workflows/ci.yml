# ============================================================================
# CI —— 持续集成
#   触发：Pull Request（所有分支）+ push 到 main
#   做：后端装依赖/语法检查/冒烟测试；前端装依赖/构建
#   注意：这里只做质量校验，不推镜像、不部署（那是 deploy.yml 的事）
# ============================================================================
name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一分支/PR 的新提交会取消上一次仍在跑的流水线
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 · 测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: 语法编译检查
        run: python -m compileall -q .

      - name: 冒烟测试（pytest）
        # 用 python -m 保证当前目录进入 sys.path，令 `from main import app` 可解析
        run: python -m pytest -q

  frontend:
    name: 前端 · 构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 构建
        run: npm run build
